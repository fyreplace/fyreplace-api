quarkus.datasource.db-kind = postgresql
quarkus.datasource.devservices.image = postgres:18
quarkus.hibernate-orm.physical-naming-strategy = org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.migrate-at-start=true
quarkus.grpc.server.use-separate-server=false
quarkus.grpc.server.max-inbound-message-size=4194304
smallrye.jwt.sign.key.location = keys/jwt.rsa.pem
mp.jwt.verify.publickey.location = keys/jwt.rsa.pub
mp.jwt.verify.issuer = ${app.url}
app.name=Fyreplace
app.local-dev=false
app.url=
app.front.url=
app.front.custom-scheme=fyreplace
app.storage.limits.max-size=1M
app.storage.limits.chapter-image-max-size=512K
app.storage.type=file
app.storage.file.path=
app.storage.s3.bucket=
app.storage.s3.custom-endpoint=

# Development

%dev.quarkus.flyway.clean-at-start=true
%dev.app.local-dev=true

# Tests

%test.quarkus.flyway.clean-at-start=true
%test.quarkus.mailer.mock=true
%test.quarkus.grpc.server.max-inbound-message-size=8388608
%test.app.storage.type=memory
%test.app.url=https://api.fyreplace.net
%test.app.front.url=https://app.fyreplace.net
