import java.security.KeyPairGenerator

plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version "${spotlessPluginVersion}"
    id 'io.freefair.lombok' version "${lombokPluginVersion}"
}

repositories {
    maven { url "https://www.javaxt.com/maven/" }
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:${quarkusPlatformVersion}")
    implementation enforcedPlatform("io.quarkus.platform:quarkus-amazon-services-bom:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkus:quarkus-elytron-security-jdbc'
    implementation 'io.quarkus:quarkus-flyway'
    implementation 'io.quarkus:quarkus-grpc'
    implementation 'io.quarkus:quarkus-hibernate-reactive-panache'
    implementation 'io.quarkus:quarkus-jdbc-h2'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-mailer'
    implementation 'io.quarkus:quarkus-reactive-pg-client'
    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-rest-client'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-scheduler'
    implementation 'io.quarkus:quarkus-security'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-smallrye-jwt'
    implementation 'io.quarkus:quarkus-smallrye-jwt-build'
    implementation 'io.quarkiverse.amazonservices:quarkus-amazon-s3'
    implementation 'io.quarkiverse.qute.web:quarkus-qute-web'
    implementation "com.twelvemonkeys.imageio:imageio-webp:${twelveMonkeysVersion}"
    implementation "com.google.zxing:core:${zxingVersion}"
    implementation "com.google.zxing:javase:${zxingVersion}"
    implementation "javaxt:javaxt-core:${javaXtVersion}"
    implementation 'software.amazon.awssdk:url-connection-client'
    implementation 'software.amazon.awssdk.crt:aws-crt'
    testImplementation 'io.quarkus:quarkus-junit'
    testImplementation 'io.quarkus:quarkus-test-vertx'
    testImplementation 'io.quarkus:quarkus-test-hibernate-reactive-panache'
    testImplementation 'io.rest-assured:rest-assured'
}

group = 'fyreplace'
version = '0.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

sourceSets {
    main {
        java {
            srcDirs += "build/classes/java/quarkus-generated-sources/grpc"
        }
    }
}

spotless {
    java {
        importOrder()
        removeUnusedImports()
        palantirJavaFormat()
        target "**/src/*/java/**/*.java"
    }
}

def isWindows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')

def writePem = { File target, String type, byte[] der ->
    def encoded = Base64.getMimeEncoder(64, '\n'.getBytes('UTF-8')).encodeToString(der)
    target.setText("-----BEGIN ${type}-----\n${encoded}\n-----END ${type}-----\n", 'UTF-8')
}

tasks.register('emails') {
    description = 'Compiles the MJML email templates into html.html files (requires Node/npx)'

    def rootDir = layout.projectDirectory.asFile
    def templatesDir = new File(rootDir, 'src/main/resources/templates')

    inputs.files(fileTree(dir: templatesDir, include: '*/html.html.mjml'))
    outputs.files(fileTree(dir: templatesDir, include: '*/html.html'))

    doLast {
        if (!templatesDir.isDirectory()) return

        def npx = isWindows ? ['cmd', '/c', 'npx'] : ['npx']

        templatesDir.listFiles().sort { it.name }.each { dir ->
            if (!dir.isDirectory()) return

            def mjml = new File(dir, 'html.html.mjml')
            if (!mjml.isFile()) return

            def input = rootDir.toPath().relativize(mjml.toPath()).toString().replace(File.separatorChar, '/' as char)
            def output = input.substring(0, input.length() - '.mjml'.length())

            logger.lifecycle('Compiling {} -> {}', input, output)

            def command = npx + [
                    'mjml',
                    '-c.minify=true',
                    '-c.allowIncludes=true',
                    '-c.includePath=src/main/resources/templates/',
                    '-o',
                    output,
                    input
            ]
            def process = new ProcessBuilder(command).directory(rootDir).redirectErrorStream(true).start()
            def result = process.inputStream.getText('UTF-8')

            if (process.waitFor() != 0) {
                throw new GradleException("mjml failed on ${input}:\n${result}")
            }

            logger.lifecycle(result.trim())
        }
    }
}

tasks.register('keygen-rsa') {
    description = 'Generates the JWT RSA keypair into src/main/resources/keys/'

    def keysDir = layout.projectDirectory.dir('src/main/resources/keys').asFile
    outputs.dir(keysDir)

    doLast {
        keysDir.mkdirs()

        def generator = KeyPairGenerator.getInstance('RSA')
        generator.initialize(2048)
        def keyPair = generator.generateKeyPair()

        writePem(new File(keysDir, 'jwt.rsa'), 'PRIVATE KEY', keyPair.private.encoded)
        writePem(new File(keysDir, 'jwt.rsa.pem'), 'PRIVATE KEY', keyPair.private.encoded)
        writePem(new File(keysDir, 'jwt.rsa.pub'), 'PUBLIC KEY', keyPair.public.encoded)

        logger.lifecycle('Generated a 2048-bit RSA keypair in {}', keysDir)
    }
}
