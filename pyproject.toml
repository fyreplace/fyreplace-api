[tool.poetry]
name = "fyreplace-api"
version = "0.0.0"
description = "Fyreplace API"
authors = []
license = "AGPL-3.0-or-later"
readme = "README.md"
packages = []

[tool.poetry.dependencies]
black = "~26.3"
boto3 = "~1.42"
celery = {extras = ["redis"], version = "~5.6"}
django = {extras = ["argon2"], version = "~5.2"}
django-anymail = {extras = ["mailgun"], version = "~14.0"}
django-celery-beat = "~2.9"
django-extensions = "~4.1"
django-storages = {extras = ["boto3"], version = "~1.14"}
django-stubs = "~5.2"
email-validator = "~2.3"
firebase-admin = "~7.3"
grpcio = "~1.80"
grpcio-tools = "~1.80"
grpc-interceptor = "~0.15"
httpx = {extras = ["http2"], version = "~0.28"}
ipython = "~9.12"
isort = "~8.0"
mysqlclient = "~2.2"
pillow = "~12.2"
psycopg = "~3.3"
pyjwt = {extras = ["crypto"], version = "~2.12"}
pytest-django = "~4.12"
pytest-xdist = {extras = ["psutil"], version = "~3.8"}
python = "~3.14"
python-dotenv = "~1.2"
python-magic = "~0.4"
qrcode = "~8.2"
rollbar = "~1.3"
tqdm = "~4.67"
uvicorn = "~0.44"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
